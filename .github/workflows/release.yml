name: release-online

on:
  push:
    tags: ["v*"]
    branches: [feature/cli_and_test, develop, main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 2.1.0)"
        required: false
        default: "2.1.0"

jobs:
  build-setup-win:
    name: Build Setup Online + ZIP ONEDIR (CUDA unico)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"
      - name: Install deps (CUDA unico)
        run: |
          python -c "import struct, platform, sys; assert struct.calcsize('P')*8==64, 'Need 64-bit Python'; print(f'Python {platform.architecture()[0]} {sys.version}')"
          pip install -r requirements.txt
          python -c "
          import importlib.metadata as m
          try:
              m.version('opencv-python-headless')
              print('ERROR: opencv-python-headless detectado — easy_ocr solo tests, no debe estar en prod')
              exit(1)
          except m.PackageNotFoundError:
              print('headless check OK (easy_ocr solo tests, no instalado en prod)')
          "
      - name: Fetch VC++ Redist x64 (for offline cv2, ~24MB)
        shell: bash
        run: |
          echo "Descargando vc_redist.x64.exe para embeber en instalador (offline cv2)..."
          curl -L -o installer/win/vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe || echo "::warning::No se pudo descargar vc_redist (build seguirá, instalador lo intentará descargar en runtime)"
          ls -lh installer/win/vc_redist.x64.exe 2>/dev/null || echo "vc_redist no embebido — instalador usará descarga en runtime"
      - name: Inject secrets (migraciones + Plate Recognizer)
        shell: bash
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          PLATE_RECOGNIZER_TOKEN: ${{ secrets.PLATE_RECOGNIZER_TOKEN }}
        run: |
          if [[ -z "$FIREBASE_SA_JSON" ]]; then
            echo "::warning::Sin FIREBASE_SA_JSON: build sin Service Account."
          else
            printf '%s' "$FIREBASE_SA_JSON" > infractivision-e8c03-firebase-adminsdk-fbsvc-957f584093.json
            ls -l infractivision-e8c03-firebase-adminsdk-fbsvc-957f584093.json
          fi
          if [[ -n "$PLATE_RECOGNIZER_TOKEN" ]]; then
            printf '%s\n' "PLATE_RECOGNIZER_API_TOKEN=$PLATE_RECOGNIZER_TOKEN" > .env
            ls -l .env
          fi
      - name: Build PyInstaller ONEDIR CUDA (unico)
        run: python -m PyInstaller --noconfirm --clean InfractiVision-ONEDIR-CUDA.spec
      - name: Smoke test ONEDIR CUDA
        shell: bash
        run: |
          ls -lh dist/
          test -f dist/InfractiVision/InfractiVision.exe || (echo "ERROR: ONEDIR exe no generado" && ls -R dist | head -n 80 && exit 1)
          echo "Smoke ONEDIR cuda OK (mismo binario corre en CPU si no hay NVIDIA)"
          ls -lh dist/InfractiVision/ | head -n 20
      - name: Zip ONEDIR CUDA portable (Win-x64)
        shell: pwsh
        run: |
          $zip = "dist/InfractiVision-cuda-Win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path dist/InfractiVision/* -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-List Name, Length
          $sz = (Get-Item $zip).Length
          Write-Host "ZIP bytes: $sz"
          if ($sz -gt 2147483647) { Write-Error "ZIP >2GB"; exit 1 }
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build Setup-Online.exe single-file (embebe ONEDIR lzma2)
        run: iscc installer/win/online.iss
      - name: Smoke Setup single-file
        shell: bash
        run: |
          ls -lh dist/InfractiVision-Setup-Online.exe
          ls -lh dist/InfractiVision/ | head -n 20
          test -f dist/InfractiVision-Setup-Online.exe || (echo "ERROR: Setup-Online no generado" && exit 1)
          SZ=$(stat -c%s "dist/InfractiVision-Setup-Online.exe" 2>/dev/null || stat -f%z "dist/InfractiVision-Setup-Online.exe" || echo 0)
          echo "Setup single-file bytes: $SZ"
          if [ "$SZ" -gt 2147483647 ]; then echo "::error::Setup >2GB"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: InfractiVision-Setup-Online-Win
          path: dist/InfractiVision-Setup-Online.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: InfractiVision-ONEDIR-Win
          path: dist/InfractiVision-cuda-Win-x64.zip
          if-no-files-found: error

  release:
    name: Publish Release (Setup + ZIP ONEDIR)
    needs: [build-setup-win]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InfractiVision-Setup-Online-Win
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: InfractiVision-ONEDIR-Win
          path: release-assets
      - name: List assets
        run: |
          ls -lhR release-assets
          echo "--- Tamaños ---"
          ls -lh release-assets/*.exe release-assets/*.zip 2>/dev/null || true
          for f in release-assets/*.exe release-assets/*.zip; do
            [ -f "$f" ] || continue
            SZ=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$f: $SZ bytes"
            if [ "$SZ" -gt 2147483647 ]; then echo "::error::$f >2GB"; exit 1; fi
          done
          test -f release-assets/InfractiVision-Setup-Online.exe || (echo "::error::Falta Setup-Online.exe" && exit 1)
          test -f release-assets/InfractiVision-cuda-Win-x64.zip || (echo "::error::Falta ZIP ONEDIR" && exit 1)
      - name: Publish GitHub Release (Setup + ZIP ONEDIR)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/InfractiVision-Setup-Online.exe
            release-assets/InfractiVision-cuda-Win-x64.zip
          generate_release_notes: true
          body: |
            ## InfractiVision ${{ github.ref_name }} — Instalador + portable (build unico CUDA)

            **Build unico CUDA con fallback CPU (sin pip on-demand).**
            - `InfractiVision-Setup-Online.exe` embebe ONEDIR CUDA completo (`dist/InfractiVision/*`, requirements.txt torch 2.8.0+cu128) comprimido con lzma2.
            - `InfractiVision-cuda-Win-x64.zip` es el mismo ONEDIR CUDA en portable: descomprimir y doble click a `InfractiVision/InfractiVision.exe` (sin instalador, sin accesos directos, sin VC++ auto-instalado).
            - Si hay NVIDIA usa GPU; si no hay, el mismo binario corre en CPU via `torch.cuda.is_available()`. Sin checkbox ni `pip install` en el instalador. Pagina GPU solo informativa.
            - Vídeos demo (5) y modelos (21 MB) on-demand.

            ### Instalación Windows
            1. Descarga `InfractiVision-Setup-Online.exe` abajo
            2. Doble click → ventana GPU muestra `✅ usará GPU` o `❌ correrá en CPU` (informativo) → elige carpeta → instalación sin descarga extra (offline-capable)
            3. Si falta VC++ Redist: https://aka.ms/vs/17/release/vc_redist.x64.exe

            ### Portable Windows (ZIP ONEDIR)
            1. Descarga `InfractiVision-cuda-Win-x64.zip`, descomprímelo donde quieras
            2. Ejecuta `InfractiVision/InfractiVision.exe`
            3. Si falla con "DLL load failed while importing cv2", instala VC++ Redist x64 (link de arriba) y reintenta.
