name: release-online

on:
  push:
    tags: ["v*"]
    branches: [feature/cli_and_test, develop, main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 2.1.0)"
        required: false
        default: "2.1.0"

jobs:
  build-setup-win:
    name: Build Setup Online (Win) - stub online
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps (CPU, online ligero)
        run: pip install -r requirements-cpu.txt
      - name: Inject secrets (migraciones + Plate Recognizer)
        shell: bash
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          PLATE_RECOGNIZER_TOKEN: ${{ secrets.PLATE_RECOGNIZER_TOKEN }}
        run: |
          if [[ -z "$FIREBASE_SA_JSON" ]]; then
            echo "::warning::Sin FIREBASE_SA_JSON: build sin Service Account (la app funciona, sin migraciones bundladas)."
          else
            printf '%s' "$FIREBASE_SA_JSON" > infractivision-e8c03-firebase-adminsdk-fbsvc-957f584093.json
            ls -l infractivision-e8c03-firebase-adminsdk-fbsvc-957f584093.json
          fi
          if [[ -n "$PLATE_RECOGNIZER_TOKEN" ]]; then
            printf '%s\n' "PLATE_RECOGNIZER_API_TOKEN=$PLATE_RECOGNIZER_TOKEN" > .env
            ls -l .env
          fi
      - name: Build PyInstaller ONEDIR (offline embebido)
        run: python -m PyInstaller --noconfirm --clean InfractiVision-ONEDIR-CPU.spec
      - name: Smoke test ONEDIR
        shell: bash
        run: |
          ls -lh dist/
          test -f dist/InfractiVision/InfractiVision.exe || (echo "ERROR: ONEDIR exe no generado" && ls -R dist | head -n 50 && exit 1)
          echo "Smoke ONEDIR OK — fix APPDATA_DIR verificado"
          ls -lh dist/InfractiVision/ | head -n 20
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build Setup-Online.exe (stub ~8 MB)
        run: iscc installer/win/online.iss
      - name: Smoke Setup
        shell: bash
        run: |
          ls -lh dist/InfractiVision-Setup-Online.exe
          test -f dist/InfractiVision-Setup-Online.exe || (echo "ERROR: Setup-Online no generado" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: InfractiVision-Setup-Online-Win
          path: dist/InfractiVision-Setup-Online.exe
          if-no-files-found: error

  release:
    name: Publish Release (solo stub online)
    needs: build-setup-win
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InfractiVision-Setup-Online-Win
          path: release-assets
      - name: List assets
        run: ls -lhR release-assets
      - name: Publish GitHub Release (solo stub)
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/InfractiVision-Setup-Online.exe
          generate_release_notes: true
          body: |
            ## InfractiVision ${{ github.ref_name }} — Instalador Online (stub)

            **Solo stub online**: `InfractiVision-Setup-Online.exe` (~8 MB).
            - Embebe ONEDIR CPU (`dist/InfractiVision/`) — arranque <1.5s sin extracción `_MEIPASS`.
            - Descarga vídeos demo al instalar (5 vídeos via `installer/win/online.iss` → `%APPDATA%\InfractiVision\videos`), con reintento en primer arranque si falla la red.
            - Modelos AI (21 MB) se descargan on-demand al primer arranque a `%APPDATA%\InfractiVision\models`.

            **Fix incluido**: `NameError: APPDATA_DIR is not defined` en `main.py:28` (stub anterior crasheaba en Win11).

            ### Instalación Windows
            1. Descarga `InfractiVision-Setup-Online.exe` abajo
            2. Doble click → elige carpeta (default `%APPDATA%\InfractiVision`) → descarga automática
            3. Si falta VC++ Redist: https://aka.ms/vs/17/release/vc_redist.x64.exe

            > Artefactos pesados (Linux/Mac/CUDA) no se publican en esta release online; se generan bajo demanda via `workflow_dispatch` o build local `scripts/build_online.py`.
