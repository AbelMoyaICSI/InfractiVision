name: release-online

on:
  push:
    tags: ["v*"]
    branches: [feature/cli_and_test, develop, main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 2.1.0)"
        required: false
        default: "2.1.0"

jobs:
  build-setup-win:
    name: Build Setup Online single-file (177M)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps (CPU)
        run: pip install -r requirements-cpu.txt
      - name: Inject secrets (migraciones + Plate Recognizer)
        shell: bash
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          PLATE_RECOGNIZER_TOKEN: ${{ secrets.PLATE_RECOGNIZER_TOKEN }}
        run: |
          if [[ -z "$FIREBASE_SA_JSON" ]]; then
            echo "::warning::Sin FIREBASE_SA_JSON: build sin Service Account."
          else
            printf '%s' "$FIREBASE_SA_JSON" > infractivision-e8c03-firebase-adminsdk-fbsvc-957f584093.json
            ls -l infractivision-e8c03-firebase-adminsdk-fbsvc-957f584093.json
          fi
          if [[ -n "$PLATE_RECOGNIZER_TOKEN" ]]; then
            printf '%s\n' "PLATE_RECOGNIZER_API_TOKEN=$PLATE_RECOGNIZER_TOKEN" > .env
            ls -l .env
          fi
      - name: Build PyInstaller ONEDIR CPU
        run: python -m PyInstaller --noconfirm --clean InfractiVision-ONEDIR-CPU.spec
      - name: Smoke test ONEDIR CPU
        shell: bash
        run: |
          ls -lh dist/
          test -f dist/InfractiVision/InfractiVision.exe || (echo "ERROR: ONEDIR exe no generado" && ls -R dist | head -n 80 && exit 1)
          echo "Smoke ONEDIR cpu OK"
          ls -lh dist/InfractiVision/ | head -n 20
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build Setup-Online.exe single-file (embebe ONEDIR lzma2)
        run: iscc installer/win/online.iss
      - name: Smoke Setup single-file
        shell: bash
        run: |
          ls -lh dist/InfractiVision-Setup-Online.exe
          ls -lh dist/InfractiVision/ | head -n 20
          test -f dist/InfractiVision-Setup-Online.exe || (echo "ERROR: Setup-Online no generado" && exit 1)
          SZ=$(stat -c%s "dist/InfractiVision-Setup-Online.exe" 2>/dev/null || stat -f%z "dist/InfractiVision-Setup-Online.exe" || echo 0)
          echo "Setup single-file bytes: $SZ"
          if [ "$SZ" -gt 2147483647 ]; then echo "::error::Setup >2GB"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: InfractiVision-Setup-Online-Win
          path: dist/InfractiVision-Setup-Online.exe
          if-no-files-found: error

  release:
    name: Publish Release single-file
    needs: [build-setup-win]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InfractiVision-Setup-Online-Win
          path: release-assets
      - name: List assets
        run: |
          ls -lhR release-assets
          echo "--- Tamaños ---"
          ls -lh release-assets/*.exe 2>/dev/null || true
          for f in release-assets/*.exe; do
            [ -f "$f" ] || continue
            SZ=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$f: $SZ bytes"
            if [ "$SZ" -gt 2147483647 ]; then echo "::error::$f >2GB"; exit 1; fi
          done
      - name: Publish GitHub Release single-file
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/InfractiVision-Setup-Online.exe
          generate_release_notes: true
          body: |
            ## InfractiVision ${{ github.ref_name }} — Instalador single-file (opcion 3 sin GCS)

            **Single-file 177M (lzma2): sin zip separado.**
            - `InfractiVision-Setup-Online.exe` embebe ONEDIR CPU completo (`dist/InfractiVision/*`) comprimido con lzma2 — no necesita descargar `InfractiVision-cpu-Win-x64.zip` (evita 404 y 275M duplicados).
            - GPU NVIDIA detectada en instalador (informativa) → si hay GPU, el instalador intenta `pip install torch==2.6.0+cu124` sobre el CPU embebido (requiere internet + Python del sistema). Si falla o no hay GPU, queda CPU + fallback `torch.cuda.is_available()`.
            - Vídeos demo (5) y modelos (21 MB) on-demand.

            ### Instalación Windows
            1. Descarga `InfractiVision-Setup-Online.exe` abajo
            2. Doble click → ventana GPU informativa → elige carpeta → instalación sin descarga extra (offline-capable)
            3. Si falta VC++ Redist: https://aka.ms/vs/17/release/vc_redist.x64.exe
