name: release-online

on:
  push:
    branches: [feature/cli_and_test, develop, main]
  workflow_dispatch:

jobs:
  build-setup-win:
    name: Build Setup Online (Win) - prueba
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps (CPU, prueba sin CUDA)
        run: pip install -r requirements-cpu.txt
      - name: Inject secrets (solo migraciones Firestore, no distribución)
        shell: bash
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          PLATE_RECOGNIZER_TOKEN: ${{ secrets.PLATE_RECOGNIZER_TOKEN }}
        run: |
          if [[ -z "$FIREBASE_SA_JSON" ]]; then
            echo "::warning::Sin FIREBASE_SA_JSON: build sin migraciones bundladas (la app funciona igual)."
          else
            printf '%s' "$FIREBASE_SA_JSON" > infractivision-e8c03-firebase-adminsdk-fbsvc-957f584093.json
            ls -l infractivision-e8c03-firebase-adminsdk-fbsvc-957f584093.json
          fi
          if [[ -n "$PLATE_RECOGNIZER_TOKEN" ]]; then
            printf '%s\n' "PLATE_RECOGNIZER_API_TOKEN=$PLATE_RECOGNIZER_TOKEN" > .env
          fi
      - name: Build PyInstaller ONEDIR (prueba)
        run: python -m PyInstaller --noconfirm --clean InfractiVision-ONEDIR-CPU.spec
      - name: Smoke test ONEDIR
        shell: bash
        run: |
          ls -lh dist/
          test -f dist/InfractiVision/InfractiVision.exe || (echo "ERROR: ONEDIR exe no generado" && ls -R dist | head -n 50 && exit 1)
          echo "Smoke ONEDIR OK"
          ls -lh dist/InfractiVision/ | head -n 20
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build Setup-Online.exe (offline embebido)
        run: iscc installer/win/online.iss
      - name: Smoke Setup
        shell: bash
        run: ls -lh dist/InfractiVision-Setup-Online.exe
      - uses: actions/upload-artifact@v4
        with:
          name: InfractiVision-Setup-Online-Win
          path: dist/InfractiVision-Setup-Online.exe
          if-no-files-found: error
