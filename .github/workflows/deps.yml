name: dependency-stack

on:
  push:
    paths:
      - 'requirements*.txt'
      - 'scripts/ci_smoke_test.py'
      - '.github/workflows/deps.yml'
  pull_request:
  workflow_dispatch:

jobs:
  verify-install:
    name: Verify stack (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test (imports + ABI numpy/torch + YOLO)
        run: python scripts/ci_smoke_test.py

      - name: Database CLI (help)
        run: python -m src.infrastructure.database --help